# Example workflow, not active in this repo's own CI.
# Copy into .github/workflows/ in your deployment of SiteDoctor if you
# want weekly re-audits of a small, explicit list of domains you (or
# your opted-in clients) actually own or have permission to audit.
# This intentionally takes an explicit, committed list rather than a
# scraped target list — auditing a domain sends real requests to
# someone else's server, and the list should only ever contain domains
# with a real relationship (your own sites, or clients who requested
# monitoring).

name: sitedoctor-weekly-audit

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: [] # add domains here explicitly, e.g. "example.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run audit
        run: |
          python -m sitedoctor.cli audit "${{ matrix.domain }}" --output "reports/${{ matrix.domain }}.md"
      - uses: actions/upload-artifact@v4
        with:
          name: sitedoctor-report-${{ matrix.domain }}
          path: reports/${{ matrix.domain }}.md
